# ============================================================================
# UKIMEA CSLV HUB — Power Apps home screen (paste-ready YAML)
# ----------------------------------------------------------------------------
# HOW TO USE
#   1. In Power Apps Studio, create a canvas app (Tablet, 16:9 — 1366 x 768).
#   2. Open the screen you want the hub on (or add a new blank screen).
#   3. Copy the ENTIRE contents of this file.
#   4. Click on the empty canvas and paste (Ctrl+V). Power Apps Studio
#      accepts YAML on the clipboard and recreates every control below.
#   5. Replace the six REPLACE_WITH_*_URL placeholders in the OnSelect of
#      btnDash1–btnDash6 with your real dashboard links.
#   6. Update the status rows (badge Text/Fill, dot Fill, descriptions)
#      whenever a dashboard's health changes — colour pairs are listed
#      next to the first badge.
#
# ANIMATIONS (all driven by the three invisible Timer controls below)
#   tmrEntrance — one-shot cascade on screen load: brand stripe sweeps in,
#                 header fades, buttons slide up one after another, then
#                 the status board and its rows fade in. Total ~1.5 s.
#   tmrIdle     — 4 s repeating loop: status dots gently "breathe" so the
#                 board reads as live.
#   tmrClock    — 1 s tick: updates the live clock and greeting.
#   htmlTicker  — stock-exchange-style ticker along the bottom: every
#                 dashboard's name and status scrolls continuously across
#                 a dark band. Its text is BUILT FROM the status badge
#                 controls, so editing a badge (e.g. "Operational" ->
#                 "Down") automatically re-words and re-colours the
#                 ticker. Scroll speed: the scrollamount attribute
#                 (higher = faster).
#   NOTE: timers only run in Preview (F5) and the published app. In
#   Studio's edit mode every control shows its finished resting state
#   (the "tmrEntrance.Value = 0" branch in each formula handles this).
#   To slow/speed the entrance, change tmrEntrance.Duration and the delay
#   numbers inside the With({p: ...}) formulas (they are milliseconds).
#   To remove all motion, delete the three timers and replace every
#   With({p: ...}, ...) formula with its resting value.
#
# COLOURS — HPE Design System, light theme (design-tokens v2.2.3)
#   page background   #F7F7F7  (background-back)
#   card surface      #FFFFFF  (background-front)
#   brand accent      #01A982  (decorative.brand)
#   heading text      #292D3A  (text-strong / text-heading)
#   body text         #3E4550  (text-default)
#   supporting text   #606A70  (text-weak)
#   card border       #D4D8DB  (border-weak)
#   button hover      #068667  (background-primary-strong)
#   button pressed    #006750  (background-primary-strong-hover)
#   focus ring        #292D3A  (color.focus)
#   status OK         dot #009A71 (icon.ok)       badge #D1FFEE (background.ok)
#   status warning    dot #D36D00 (icon.warning)  badge #FFF3DD (background.warning)
#   status critical   dot #CC1F1A (icon.critical) badge #FFECEC (background.critical)
#   status unknown    dot #606A70 (icon.unknown)  badge RGBA(0,0,0,10) (background.unknown)
# ============================================================================

# ---- Animation engine: three invisible timers --------------------------------
- tmrEntrance:
    Control: Timer
    Properties:
      Duration: =1500
      AutoStart: =true
      Repeat: =false
      Visible: =false
      OnTimerEnd: =Set(varLoaded, true)

- tmrIdle:
    Control: Timer
    Properties:
      Duration: =4000
      AutoStart: =true
      Repeat: =true
      Visible: =false

- tmrClock:
    Control: Timer
    Properties:
      Duration: =1000
      AutoStart: =true
      Repeat: =true
      Visible: =false
      OnTimerEnd: =Set(varNow, Now())

# ---- Page background (elevation 0) -----------------------------------------
- recPageBackground:
    Control: Rectangle
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =ColorValue("#F7F7F7")
      BorderStyle: =BorderStyle.None
      TabIndex: =-1

# ---- Header -----------------------------------------------------------------
- recHeaderBar:
    Control: Rectangle
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =104
      Fill: =ColorValue("#FFFFFF")
      BorderStyle: =BorderStyle.None
      TabIndex: =-1

# Brand stripe sweeps across the top on load (width grows 0 -> full).
- recBrandStripe:
    Control: Rectangle
    Properties:
      X: =0
      Y: =0
      Width: |-
        =With({p: If(varLoaded = true || tmrEntrance.Value = 0, 1, Min(1, Max(0, tmrEntrance.Value / 500)))}, Parent.Width * (1 - Power(1 - p, 3)))
      Height: =6
      Fill: =ColorValue("#01A982")
      BorderStyle: =BorderStyle.None
      TabIndex: =-1

- recHeaderRule:
    Control: Rectangle
    Properties:
      X: =0
      Y: =103
      Width: =Parent.Width
      Height: =1
      Fill: =ColorValue("#E6E8E9")
      BorderStyle: =BorderStyle.None
