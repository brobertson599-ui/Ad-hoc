# ---- Status ticker (NYSE style) -------------------------------------------------
# Auto-syncing marquee: content is generated from the name/badge controls,
# which are themselves fed by Excel — so the ticker is Excel-driven too.
#   Operational -> ▲ green #05CC93 · Limited -> ◆ amber #EC8C25
#   Down -> ▼ red #FC6161 · anything else -> ● grey #7D8A92
- htmlTicker:
    Control: HtmlViewer
    Properties:
      X: =0
      Y: =728
      Width: =Parent.Width
      Height: =40
      Fill: =ColorValue("#292D3A")
      BorderStyle: =BorderStyle.None
      PaddingLeft: =0
      PaddingRight: =0
      PaddingTop: =0
      PaddingBottom: =0
      HtmlText: |-
        ="<div style='font-family:Segoe UI,Arial,sans-serif;font-size:15px;line-height:38px;letter-spacing:1px;white-space:nowrap;'><marquee scrollamount='4'>" &
        "<span style='color:#ffffff;font-weight:600;'>" & Upper(lblStatusName1.Text) & "</span>&nbsp;&nbsp;<span style='color:" & If(btnStatusBadge1.Text = "Operational", "#05cc93", btnStatusBadge1.Text = "Limited", "#ec8c25", btnStatusBadge1.Text = "Down", "#fc6161", "#7d8a92") & ";font-weight:bold;'>" & If(btnStatusBadge1.Text = "Operational", "▲", btnStatusBadge1.Text = "Limited", "◆", btnStatusBadge1.Text = "Down", "▼", "●") & "&nbsp;" & Upper(btnStatusBadge1.Text) & "</span><span style='color:#7d8a92;'>&nbsp;&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;&nbsp;</span>" &
