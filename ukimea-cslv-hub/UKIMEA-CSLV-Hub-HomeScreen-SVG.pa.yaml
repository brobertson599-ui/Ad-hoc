# ============================================================================
# UKIMEA CSLV HUB — Power Apps home screen, SVG + LIVE EXCEL EDITION
# ----------------------------------------------------------------------------
# Same design as UKIMEA-CSLV-Hub-HomeScreen.pa.yaml, rebuilt with:
#
# 1) SVG GRAPHICS — every visual (header, button cards, status card, status
#    dots) is an Image control whose Image property is an inline SVG with
#    its animations baked in as CSS keyframes: smooth 60 fps, they even
#    play in Studio's edit mode, and no animation timers are needed.
#
# 2) HPE-THEMED ENTRANCE — the HPE "element" (the green rectangle outline
#    from the brand mark) draws itself beside the title, the brand stripe
#    sweeps across, card borders trace themselves in one after another, a
#    green accent underline sweeps beneath each dashboard name, the status
#    card outline draws and its row separators grow in, and the dots pop.
#    IDLE — a soft light shimmer crosses the brand stripe every 7 s and
#    each status dot emits a radar "ping" ring in its status colour.
#
# 3) LIVE EXCEL DATA — statuses, descriptions, badge colours, dot colours,
#    the ticker AND the six button links all read from an Excel table.
#    Update the Excel file and the app follows (on refresh — see below).
#
#    EXCEL SETUP (do this BEFORE pasting, or paste shows formula errors
#    that clear once the data source is added):
#      a. Put the workbook in OneDrive for Business (or SharePoint).
#      b. Select your data including headers -> Insert > Table. Then on
#         the Table Design tab rename the table to exactly: DashboardStatus
#      c. Columns must be exactly:  Dashboard | Status | Text | URL
#         - Dashboard: must EXACTLY match the six names shown in the app
#           (the row labels lblStatusName1-6 are the lookup keys)
#         - Status: green / orange / red (or Operational / Limited /
#           Down) — the app translates colour words into badge words;
#           anything else shows grey Unknown
#         - Text: the one-line reason shown in the status board
#         - URL: the dashboard link the button opens
#      d. In Power Apps Studio: Data pane > Add data >
#         "Excel Online (Business)" > sign in > pick the file > tick the
#         DashboardStatus table > Connect.
#      e. Now paste this file onto a blank Tablet screen (1366 x 768).
#    REFRESH: data loads when the app starts and re-pulls every 5 minutes
#    (tmrRefresh). Change tmrRefresh.Duration to alter the cadence. Excel
#    is polled, not pushed — changes appear on the next refresh.
#
# Because SVGs inside an Image control cannot react to the mouse, each
# dashboard card has an invisible Classic/Button on top (btnDash1-6) that
# provides the hover colour change, pressed state, focus ring, tooltip and
# the Launch() — whose URL comes from the Excel row.
# NOTE: a dashboard's display name appears in the SVG card (imgDash n),
# the overlay button Text, and the row label (lblStatusName n) — keep all
# three matching the Excel Dashboard column.
#
# COLOURS — HPE Design System light theme (design-tokens v2.2.3); the
# ticker uses dark-theme status tokens on background.neutral.xstrong.
# ============================================================================

# ---- Timers: 1 s clock tick + 5 min Excel refresh ----------------------------
- tmrClock:
    Control: Timer
    Properties:
      Duration: =1000
      AutoStart: =true
      Repeat: =true
      Visible: =false
      OnTimerEnd: =Set(varNow, Now())

- tmrRefresh:
    Control: Timer
    Properties:
      Duration: =300000
      AutoStart: =true
      Repeat: =true
      Visible: =false
      OnTimerEnd: =Refresh(DashboardStatus); Set(varRefreshed, Now())

# ---- Page background (elevation 0) -----------------------------------------
- recPageBackground:
    Control: Rectangle
    Properties:
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
      Fill: =ColorValue("#F7F7F7")
      BorderStyle: =BorderStyle.None
      TabIndex: =-1

# ---- Header (SVG: HPE element mark draws itself, brand stripe sweeps with
#      idle shimmer, title and subtitle rise in) --------------------------------
- imgHeader:
    Control: Image
    Properties:
      X: =0
      Y: =0
      Width: =1366
      Height: =104
      Image: |-
        ="data:image/svg+xml;utf8," & EncodeUrl(
        "<svg xmlns='http://www.w3.org/2000/svg' width='1366' height='104' viewBox='0 0 1366 104'>" &
        "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='rgba(255,255,255,0)'/><stop offset='0.5' stop-color='rgba(255,255,255,0.65)'/><stop offset='1' stop-color='rgba(255,255,255,0)'/></linearGradient></defs>" &
        "<style>" &
        ".stripe{transform-origin:0 0;animation:sweep 0.5s cubic-bezier(0.22,1,0.36,1) both}" &
        ".shine{animation:shine 7s linear 1.2s infinite}" &
        ".e{stroke-dasharray:150;stroke-dashoffset:150;animation:draw 0.7s ease-out 0.05s forwards}" &
        ".t1{animation:rise 0.45s cubic-bezier(0.22,1,0.36,1) 0.3s both}" &
        ".t2{animation:rise 0.45s cubic-bezier(0.22,1,0.36,1) 0.45s both}" &
        "@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}" &
        "@keyframes shine{0%{transform:translateX(0)}30%{transform:translateX(1966px)}100%{transform:translateX(1966px)}}" &
        "@keyframes draw{to{stroke-dashoffset:0}}" &
        "@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}" &
        "</style>" &
        "<rect width='1366' height='104' fill='#ffffff'/>" &
        "<rect y='103' width='1366' height='1' fill='#e6e8e9'/>" &
        "<rect class='stripe' width='1366' height='6' fill='#01a982'/>" &
        "<rect class='shine' x='-300' width='260' height='6' fill='url(#g)'/>" &
        "<rect class='e' x='48' y='20' width='46' height='26' fill='none' stroke='#01a982' stroke-width='5'/>" &
        "<text class='t1' x='110' y='44' font-family='Segoe UI,Arial,sans-serif' font-size='30' font-weight='700' fill='#292d3a'>UKIMEA CSLV HUB</text>" &
        "<text class='t2' x='110' y='80' font-family='Segoe UI,Arial,sans-serif' font-size='15' fill='#606a70'>Central access to UKIMEA CSLV reporting dashboards</text>" &
        "</svg>")

# Personalised greeting — uses the signed-in user's first name.
- lblGreeting:
    Control: Label
    Properties:
      Text: |-
        ="Good " & If(Hour(If(IsBlank(varNow), Now(), varNow)) < 12, "morning", Hour(If(IsBlank(varNow), Now(), varNow)) < 17, "afternoon", "evening") & If(IsBlank(User().FullName), "", ", " & First(Split(User().FullName, " ")).Value)
      X: =766
      Y: =26
      Width: =552
      Height: =26
      Align: =Align.Right
      Font: =Font.'Open Sans'
      FontWeight: =FontWeight.Semibold
      Size: =13
      Color: =ColorValue("#292D3A")

# Live clock — ticks every second via tmrClock.
- lblClock:
    Control: Label
    Properties:
      Text: |-
        =With({t: If(IsBlank(varNow), Now(), varNow)}, Text(t, "ddd dd mmm yyyy") & "   " & Text(t, "HH:mm:ss"))
      X: =766
      Y: =56
      Width: =552
      Height: =22
      Align: =Align.Right
      Font: =Font.'Open Sans'
      Size: =11
      Color: =ColorValue("#606A70")

# ---- Dashboard links ---------------------------------------------------------
- lblSectionDashboards:
    Control: Label
    Properties:
      Text: ="Dashboards"
      X: =48
      Y: =116
      Width: =400
      Height: =22
      Font: =Font.'Open Sans'
      FontWeight: =FontWeight.Semibold
      Size: =14
      Color: =ColorValue("#292D3A")

